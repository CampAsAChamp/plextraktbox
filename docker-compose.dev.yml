# Dev stack: hot-reload backend + Vite frontend. Use `mise run up-dev` (Doppler).
# Open http://localhost:5173 (UI) — API on http://localhost:8000.
# Without Doppler: `mise run up-dev-env` with secrets in `.env`.
# `up-dev` goes through scripts/compose-up-dev.sh so Ctrl+C waits for teardown.
services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev-backend
    image: plextraktbox-dev-backend:latest
    container_name: plextraktbox-dev-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/plextraktbox:/app/backend/plextraktbox
      - ./backend/migrations:/app/backend/migrations
      - ./data:/data
    env_file:
      - path: .env
        required: false
    environment:
      ENV: local
      LOG_FORMAT: console
      FORCE_COLOR: "1"
      DATA_DIR: /data
      # Host env wins over env_file when set (Doppler / shell). Compose also loads `.env` for ${…}.
      SECRET_KEY: ${SECRET_KEY:-}
      TRAKT_CLIENT_ID: ${TRAKT_CLIENT_ID:-}
      TRAKT_CLIENT_SECRET: ${TRAKT_CLIENT_SECRET:-}
      # Set by compose-up-dev.sh (git rev-parse); release images bake this via Dockerfile ARG.
      PLEXTRAKTBOX_GIT_SHA: ${PLEXTRAKTBOX_GIT_SHA:-}
      # Bind mounts on macOS/Podman often miss fs events; poll so uvicorn --reload works.
      WATCHFILES_FORCE_POLLING: "true"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev-frontend
    image: plextraktbox-dev-frontend:latest
    container_name: plextraktbox-dev-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app/frontend
      - frontend_node_modules:/app/frontend/node_modules
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
      FORCE_COLOR: "1"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  frontend_node_modules:
