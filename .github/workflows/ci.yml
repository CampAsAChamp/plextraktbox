name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Stub .env for mise
        run: |
          cp .env.example .env
          {
            echo "SECRET_KEY=ci-test-secret-key-not-for-production"
            echo "TRAKT_CLIENT_ID=ci-trakt-client-id"
            echo "TRAKT_CLIENT_SECRET=ci-trakt-client-secret"
          } >> .env

      - name: Run check
        run: mise run check
