name: Publish release image

# Manual tags (e.g. git push origin vX.Y.Z). Automated releases publish from
# release-please.yml — GITHUB_TOKEN tag creates do not trigger this workflow.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Stub .env for mise
        run: |
          cp .env.example .env
          {
            echo "SECRET_KEY=ci-test-secret-key-not-for-production"
            echo "TRAKT_CLIENT_ID=ci-trakt-client-id"
            echo "TRAKT_CLIENT_SECRET=ci-trakt-client-secret"
          } >> .env

      - name: Run check
        run: mise run check

      - name: Build metadata
        id: meta
        run: echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/campasachamp/plextraktbox:${{ github.ref_name }}
            ghcr.io/campasachamp/plextraktbox:latest
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.meta.outputs.built_at }}
