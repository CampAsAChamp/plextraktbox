name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      # Path-prefixed outputs (package key is "backend", not root ".")
      release_created: ${{ steps.release.outputs['backend--release_created'] }}
      tag_name: ${{ steps.release.outputs['backend--tag_name'] }}
    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Publish in this run: tags created with GITHUB_TOKEN do not trigger other workflows.
  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Install mise
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Stub .env for mise
        run: |
          cp .env.example .env
          {
            echo "SECRET_KEY=ci-test-secret-key-not-for-production"
            echo "TRAKT_CLIENT_ID=ci-trakt-client-id"
            echo "TRAKT_CLIENT_SECRET=ci-trakt-client-secret"
          } >> .env

      - name: Run check
        run: mise run check

      - name: Build metadata
        id: meta
        run: echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/campasachamp/plextraktbox:${{ needs.release-please.outputs.tag_name }}
            ghcr.io/campasachamp/plextraktbox:latest
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.meta.outputs.built_at }}
