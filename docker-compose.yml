services:
  plextraktbox:
    build: .
    image: plextraktbox:latest
    container_name: plextraktbox
    ports:
      - "8000:8000"
    environment:
      PLEXTRAKTBOX_ENV: prod
      # REQUIRED in prod. Generate one with: python -c "import secrets; print(secrets.token_urlsafe(48))"
      PLEXTRAKTBOX_SECRET_KEY: ${PLEXTRAKTBOX_SECRET_KEY:?set PLEXTRAKTBOX_SECRET_KEY in .env}
      PLEXTRAKTBOX_DATA_DIR: /data
    volumes:
      - plextraktbox_data:/data
    restart: unless-stopped

volumes:
  plextraktbox_data:
