services:
  plextraktbox:
    build: .
    image: plextraktbox:latest
    container_name: plextraktbox
    ports:
      - "8000:8000"
    environment:
      ENV: prod
      # REQUIRED in prod. Generate one with: python -c "import secrets; print(secrets.token_urlsafe(48))"
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      TRAKT_CLIENT_ID: ${TRAKT_CLIENT_ID:?set TRAKT_CLIENT_ID in .env}
      TRAKT_CLIENT_SECRET: ${TRAKT_CLIENT_SECRET:?set TRAKT_CLIENT_SECRET in .env}
      DATA_DIR: /data
    volumes:
      - ./data:/data
    restart: unless-stopped
