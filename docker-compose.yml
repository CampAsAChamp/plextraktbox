# Secrets: use a gitignored .env (default for TrueNAS / self-host), or inject from the host
# environment (advanced — e.g. `doppler run -- podman compose up --build` for maintainers).
services:
  plextraktbox:
    build:
      context: .
      args:
        # Set USE_CORPORATE_CA=1 in .env on Zscaler laptops so npm/pip trust docker/certs/.
        # Default 0 — CI and GHCR publish without baking the CA into the runtime image.
        USE_CORPORATE_CA: ${USE_CORPORATE_CA:-0}
    image: plextraktbox:latest
    container_name: plextraktbox
    ports:
      # Host and container port both follow PORT (default 8000). Set PORT=8001 in .env if 8000 is taken.
      - "${PORT:-8000}:${PORT:-8000}"
    environment:
      ENV: prod
      # REQUIRED in prod. Generate one with: python -c "import secrets; print(secrets.token_urlsafe(48))"
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env or via Doppler}
      TRAKT_CLIENT_ID: ${TRAKT_CLIENT_ID:?set TRAKT_CLIENT_ID in .env or via Doppler}
      TRAKT_CLIENT_SECRET: ${TRAKT_CLIENT_SECRET:?set TRAKT_CLIENT_SECRET in .env or via Doppler}
      DATA_DIR: /data
      PORT: ${PORT:-8000}
      # Optional: match host dataset ownership (TrueNAS apps often use apps user 568)
      PUID: ${PUID:-}
      PGID: ${PGID:-}
    volumes:
      - ./data:/data
    restart: unless-stopped
