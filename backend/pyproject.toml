[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plextraktbox"
version = "0.12.0"
description = "All-in-one Plex + Letterboxd + Trakt sync tool with a web UI"
requires-python = ">=3.14"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlmodel>=0.0.22",
    "alembic>=1.14",
    "apscheduler>=3.11,<4",
    "pydantic-settings>=2.7",
    "bcrypt>=4.0",
    "itsdangerous>=2.2",
    "cryptography>=44",
    "python-multipart>=0.0.18",
    "structlog>=24.4",
    "httpx>=0.28",
    "sse-starlette>=2.1",
    # third-party service clients
    "plexapi>=4.16",
    "trakt.py>=4.4",
    "requests-cache>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "respx>=0.22",
    "ruff>=0.9",
    "mypy>=1.14",
]

[project.scripts]
plextraktbox = "plextraktbox.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["plextraktbox*"]

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008"]  # FastAPI Depends() in defaults

[tool.mypy]
python_version = "3.14"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
