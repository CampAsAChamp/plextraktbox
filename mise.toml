# plextraktbox — tool versions, dev env, and common workflows.
# Install mise: https://mise.jdx.dev/getting-started.html
# First run in this repo: mise trust && mise install
#
# Task groups (shown in descriptions as [META], [LOCAL], [DOCKER-PROD], [DOCKER-DEV]):
#   META         — lint, typecheck, tests (CI parity)
#   LOCAL        — native install, build, dev servers, DB migrations, cleanup
#   DOCKER-PROD  — production container lifecycle (single service on :8000)
#   DOCKER-DEV   — dev containers with hot reload (backend :8000 + Vite :5173)

[tools]
python = "3.14"
node = "24"
jq = "1.7"

[env]
# Load repo-root .env for tasks; do not hardcode SECRET_KEY/DATA_DIR here.
_.file = ".env"

[tasks."dev-backend".env]
DATA_DIR = "{{ config_root }}/data"

[tasks."db-upgrade".env]
DATA_DIR = "{{ config_root }}/data"

# --- META: CI / quality ---

[tasks.check]
description = "[META] Run linters/typecheck and all tests (CI parity)"
depends = ["lint", "test"]

[tasks."check-doppler"]
description = "[META] Run check with secrets from Doppler (maintainer; no hand-edited .env needed)"
run = "doppler run -- mise run check"

[tasks."generate-api-types"]
description = "[META] Generate frontend OpenAPI TypeScript types from FastAPI schema"
depends = ["install-backend", "install-frontend"]
run = "bash scripts/generate-api-types.sh"

[tasks."check-api-types"]
description = "[META] Fail if committed OpenAPI TypeScript types are out of date"
depends = ["install-backend", "install-frontend"]
run = "bash scripts/generate-api-types.sh --check"

[tasks.lint]
description = "[META] Run ruff, mypy, frontend lint/format/typecheck, and OpenAPI types drift check"
depends = ["install-backend", "install-frontend", "check-api-types"]
run = '''
backend/.venv/bin/ruff check backend/plextraktbox
backend/.venv/bin/ruff format --check backend/plextraktbox
backend/.venv/bin/mypy --config-file backend/pyproject.toml backend/plextraktbox
cd frontend && npm run lint && npm run format:check && npm run typecheck
'''

[tasks."lint-fix"]
description = "[META] Auto-fix Ruff/ESLint issues and apply Ruff/Prettier formatting"
depends = ["install-backend", "install-frontend"]
run = '''
backend/.venv/bin/ruff check --fix backend/plextraktbox
backend/.venv/bin/ruff format backend/plextraktbox
cd frontend && npm run lint:fix && npm run format
'''

[tasks.test]
description = "[META] Run backend and frontend test suites"
depends = ["test-backend", "test-frontend"]

[tasks."test-backend"]
description = "[META] Run backend pytest suite"
depends = ["install-backend"]
dir = "{{ config_root }}/backend"
run = ".venv/bin/python -m pytest"

[tasks."test-frontend"]
description = "[META] Run frontend vitest suite"
depends = ["install-frontend"]
dir = "{{ config_root }}/frontend"
run = "npm run test"

# --- LOCAL: native install, build, dev ---

[tasks.install]
description = "[LOCAL] Install backend and frontend dependencies; enable git hooks"
depends = ["install-backend", "install-frontend", "install-hooks"]

[tasks."install-hooks"]
description = "[LOCAL] Point git at .githooks (commit-msg + pre-push check)"
run = "git config core.hooksPath .githooks"

[tasks."install-backend"]
description = "[LOCAL] Create venv and install backend (incl. dev extras)"
dir = "{{ config_root }}/backend"
run = '''
if [ ! -x .venv/bin/python ] || ! .venv/bin/python -m pip --version >/dev/null 2>&1; then
  rm -rf .venv
  python -m venv .venv
fi
.venv/bin/python -m pip install -e ".[dev]"
'''

[tasks."install-frontend"]
description = "[LOCAL] Install frontend dependencies (npm ci)"
dir = "{{ config_root }}/frontend"
run = "npm ci"

[tasks.build]
description = "[LOCAL] Build SPA into backend/static and ensure backend venv is installed"
depends = ["install-backend", "build-frontend"]

[tasks."build-frontend"]
description = "[LOCAL] Build React app into backend/plextraktbox/static"
depends = ["install-frontend"]
dir = "{{ config_root }}/frontend"
run = "npm run build"

[tasks."db-upgrade"]
description = "[LOCAL] Apply Alembic migrations to the local SQLite DB"
depends = ["install-backend"]
dir = "{{ config_root }}/backend"
run = ".venv/bin/python -m alembic upgrade head"

[tasks."dev-backend"]
description = "[LOCAL] Run uvicorn with reload natively (terminal 1; or use up-dev)"
depends = ["install-backend", "db-upgrade"]
dir = "{{ config_root }}/backend"
run = ".venv/bin/uvicorn plextraktbox.main:app --reload --use-colors --no-access-log"

[tasks."dev-frontend"]
description = "[LOCAL] Run Vite dev server natively (terminal 2; or use up-dev)"
depends = ["install-frontend"]
dir = "{{ config_root }}/frontend"
run = "npm run dev"

# --- LOCAL: cleanup ---

[tasks.clean]
description = "[LOCAL] Remove build artifacts and tool caches"
depends = ["clean-frontend", "clean-backend"]

[tasks."clean-frontend"]
description = "[LOCAL] Remove frontend dist and TypeScript build info"
run = "rm -rf frontend/dist && find frontend -name '*.tsbuildinfo' -delete"

[tasks."clean-backend"]
description = "[LOCAL] Remove SPA output, Python caches, and egg metadata"
run = '''
rm -rf backend/plextraktbox/static backend/.pytest_cache backend/.mypy_cache \
  backend/.ruff_cache backend/plextraktbox.egg-info
find backend -name __pycache__ -type d -prune -exec rm -rf {} +
'''

[tasks."clean-data"]
description = "[LOCAL] Remove local SQLite DB and runtime data directories"
run = "rm -rf data"

[tasks."clean-deps"]
description = "[LOCAL] Remove venv and node_modules (full reinstall next time)"
run = "rm -rf backend/.venv frontend/node_modules"

[tasks."clean-all"]
description = "[LOCAL] Remove artifacts, local data/deps, and stop container"
depends = ["clean", "clean-data", "clean-deps", "down-v"]

# --- DOCKER-PROD: production container ---

[tasks.up]
description = "[DOCKER-PROD] Start production container (foreground, rebuilds image)"
run = "podman compose up --build"

[tasks."up-doppler"]
description = "[DOCKER-PROD] Start production container with secrets from Doppler (maintainer)"
run = "doppler run -- podman compose up --build"

[tasks.down]
description = "[DOCKER-PROD] Stop container and keep the ./data directory"
run = "podman compose down"

[tasks."down-v"]
description = "[DOCKER-PROD] Stop container and delete ./data (fresh DB next start)"
run = '''
podman compose down
rm -rf data
'''

# --- DOCKER-DEV: dev containers with hot reload ---

[tasks."up-dev"]
description = "[DOCKER-DEV] Start hot-reload stack with secrets from Doppler (backend :8000, frontend :5173)"
run = "bash scripts/compose-up-dev.sh"

[tasks."up-dev-env"]
description = "[DOCKER-DEV] Hot-reload stack using .env only (no Doppler)"
run = "USE_DOPPLER=0 bash scripts/compose-up-dev.sh"

[tasks."down-dev"]
description = "[DOCKER-DEV] Stop dev containers"
run = "podman compose -f docker-compose.dev.yml down"

[tasks."rebuild-dev"]
description = "[DOCKER-DEV] Stop dev stack, rebuild images from scratch, and start (Doppler secrets)"
run = '''
podman compose -f docker-compose.dev.yml down -v
podman compose -f docker-compose.dev.yml build --no-cache
BUILD=0 bash scripts/compose-up-dev.sh
'''

# --- utilities ---

[tasks."api-login"]
description = "[UTIL] Save cookies.txt for curl API smoke tests (Doppler or .env DEV_USER/DEV_PASSWORD)"
run = "doppler run -- bash scripts/api-login.sh"

[tasks."dev-bootstrap"]
description = "[UTIL] Create dev user + connections from Doppler/.env after wiping ./data (API must be running)"
depends = ["install-backend"]
run = "doppler run -- backend/.venv/bin/python scripts/dev-bootstrap.py bootstrap"

[tasks."dev-export-secrets"]
description = "[UTIL] Print env lines for user + connection secrets from local SQLite DB (Doppler SECRET_KEY)"
depends = ["install-backend"]
run = "doppler run -- backend/.venv/bin/python scripts/dev-bootstrap.py export"

[tasks."dev-reencrypt-secrets"]
description = "[UTIL] Re-encrypt connection secrets after migrating off legacy SECRET_KEY=dev"
depends = ["install-backend"]
run = "doppler run -- backend/.venv/bin/python scripts/dev-bootstrap.py reencrypt"
